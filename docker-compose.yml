services:
  lighthouse:
    image: ${IMAGE:-lighthouse:local}
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    ports:
      - "443:8443/tcp"
      - "5349:5349/udp"
    volumes:
      - lighthouse_data:/etc/lighthouse
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"

volumes:
  lighthouse_data:
