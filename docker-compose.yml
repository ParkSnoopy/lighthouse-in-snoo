services:
  lighthouse:
    image: ${LIGHTHOUSE_IMAGE:-lighthouse:local}
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-0.1.0}
        LIGHTHOUSE_STUN_DOMAIN: ${LIGHTHOUSE_STUN_DOMAIN:-}
        LIGHTHOUSE_STUN_PORT: ${LIGHTHOUSE_STUN_PORT:-5349}
        LIGHTHOUSE_HUB_ORIGIN: ${LIGHTHOUSE_HUB_ORIGIN:-}
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    ports:
      - "443:8443/tcp"
      - "5349:5349/udp"
    volumes:
      - ./config:/etc/lighthouse:ro
      - lighthouse-state:/var/lib/lighthouse
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"

volumes:
  lighthouse-state:
