name: Build and Publish Lighthouse Hub Container

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install Fyne Linux Headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev xorg-dev libxkbcommon-dev

      - name: Static Analysis, Go-Critic, Builds, and Race Tests
        run: |
          make lint
          make build
          make build-ui
          go test -race -count=1 ./...

      - name: Resolve and Verify Version Alignment
        id: version
        run: |
          BIN_VER="$(./bin/lighthouse --version | awk '{print $2}')"
          UI_VER="$(./bin/lighthouse-ui --version | awk '{print $2}')"
          if [ -z "$BIN_VER" ] || [ "$BIN_VER" != "$UI_VER" ]; then
            echo "version mismatch: lighthouse=${BIN_VER} lighthouse-ui=${UI_VER}" >&2
            exit 1
          fi
          RELEASE_VER="$BIN_VER"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VER" != "$BIN_VER" ]; then
              echo "Tag ${GITHUB_REF_NAME} does not match lighthouse --version (${BIN_VER})" >&2
              exit 1
            fi
            RELEASE_VER="$TAG_VER"
          fi
          echo "version=${RELEASE_VER}" >> "$GITHUB_OUTPUT"

  container:
    needs: verify
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.verify.outputs.version }}
            type=raw,value=v${{ needs.verify.outputs.version }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and Push Hub Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
