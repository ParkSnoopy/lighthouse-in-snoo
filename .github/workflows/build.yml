name: Build and Publish Lighthouse Hub Container

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  container:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve Release Version
        id: version
        run: |
          RELEASE_VER="$(sed -n 's/^const Version = "\(.*\)"/\1/p' pkg/version/version.go)"
          if [ -z "$RELEASE_VER" ]; then
            echo "failed to resolve version from pkg/version/version.go" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VER" != "$RELEASE_VER" ]; then
              echo "Tag ${GITHUB_REF_NAME} does not match pkg/version/version.go (${RELEASE_VER})" >&2
              exit 1
            fi
          fi
          echo "version=${RELEASE_VER}" >> "$GITHUB_OUTPUT"

      - name: Cache Go Modules
        id: cache-gomod
        uses: actions/cache@v6
        with:
          path: /tmp/cache/gomod
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-

      - name: Populate Go Module Cache
        if: steps.cache-gomod.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/cache/gomod
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e GOMODCACHE=/cache/gomod \
            -e GOFLAGS=-modcacherw \
            -v /tmp/cache/gomod:/cache/gomod \
            -v "${PWD}/go.mod:/src/go.mod:ro" \
            -v "${PWD}/go.sum:/src/go.sum:ro" \
            -w /src \
            golang:1.27-alpine go mod download

      - name: Cache Debian APT Packages
        id: cache-apt
        uses: actions/cache@v6
        with:
          path: /tmp/cache/apt
          key: apt-debian13-${{ runner.os }}-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            apt-debian13-${{ runner.os }}-

      - name: Populate Debian APT Cache
        if: steps.cache-apt.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/cache/apt/archives /tmp/cache/apt/lists
          docker run --rm \
            -v /tmp/cache/apt/archives:/var/cache/apt/archives \
            -v /tmp/cache/apt/lists:/var/lib/apt/lists \
            debian:13-slim sh -eu -c "
              rm -f /etc/apt/apt.conf.d/docker-clean
              apt-get update
              apt-get install -y --download-only --no-install-recommends ca-certificates
              rm -rf /var/cache/apt/archives/lock /var/cache/apt/archives/partial /var/lib/apt/lists/lock /var/lib/apt/lists/partial
              chown -R $(id -u):$(id -g) /var/cache/apt/archives /var/lib/apt/lists
            "

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=v${{ steps.version.outputs.version }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and Push Hub Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          build-contexts: |
            gomod-cache=/tmp/cache/gomod
            apt-cache=/tmp/cache/apt
          cache-from: type=gha
          cache-to: type=gha,mode=max
